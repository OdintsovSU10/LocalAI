# Copy this file to config/sources.yaml for a clean local setup.
# Use only local or approved network paths. Do not commit real user paths.
sources:
  - id: demo-local-source
    title: Demo local documents
    path: C:\LocalAI\demo-documents
    include:
      - "**/*.pdf"
      - "**/*.txt"
      - "**/*.md"
      - "**/*.csv"
      - "**/*.docx"
      - "**/*.xlsx"
      - "**/*.xlsm"
    exclude:
      - "~$"
      - "thumbs.db"
      - ".ds_store"
    contextLinks: []
    additionalPaths: []
    # sourceType: contract
    # linkedContractId: ""

  # Распознанная тендерная ПД: папка тендера из TENDER.
  # Отдельный sourceType для неё не нужен — она опознаётся по наличию
  # project/_admin/SHEET_INDEX.csv, который появляется после навыка bootstrap-tender.
  # Для такой папки в меню действий с индексом появляется «Экспорт индекса для удалёнки»
  # (либо scripts/export-tender-index.mjs). Индекс ложится в
  # <тендер>/project/_admin/VECTOR_INDEX и уезжает на удалённую машину вместе с тендером,
  # поэтому там не нужны ни Qdrant, ни модель.
  - id: demo-tender-pd
    title: Тендер ЖК Пример 6.1
    path: C:\Users\Usrr\VSCode\Odintsov\TENDER\Тендер ЖК Пример 6.1
    include:
      - "project/PD/**/markdown/*.md"
      - "project/customer-boq/markdown/*.md"
    exclude:
      - "project/_incoming/**"
      - "project/_review/**"

  - id: demo-tender-source
    title: 279. ЖК Летная 71, Летная 98
    path: G:\My Drive\003 Tenders 2025\Active\279 Example
    sourceType: tender
    tenderCategory: В работе
    linkedContractId: demo-local-source
    include:
      - "**/*.pdf"
      - "**/*.txt"
      - "**/*.md"
      - "**/*.csv"
      - "**/*.docx"
      - "**/*.xlsx"
      - "**/*.xlsm"
      - "**/*.xls"
    exclude:
      - "~$"
      - "thumbs.db"
      - ".ds_store"
      - "desktop.ini"
    contextLinks: []
